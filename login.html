<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In · Batangas State University TNEU Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body class="login-body">
  <main class="login-container">

    <!-- Left: photo card -->
    <section class="login-left" id="stage">
      <div class="login-image-bg" style="background-image: url('medias/BSU.jpeg');"></div>
      <div class="login-left-overlay"></div>
      <div class="login-glow"></div>

      <div class="login-branding">
        <a href="landing.html" class="logo-area">
          <img src="medias/BSU-Logo.jpeg" alt="BSU logo" class="logo-img"
               onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ccircle cx=%2250%22 cy=%2250%22 r=%2245%22 fill=%22%23E93324%22/%3E%3Ctext x=%2250%22 y=%2268%22 font-size=%2240%22 text-anchor=%22middle%22 fill=%22white%22 font-weight=%22bold%22%3EB%3C/text%3E%3C/svg%3E'">
          <span class="logo-text-block">
            <span class="logo-university">Batangas State University</span>
            <span class="logo-subtitle">The National Engineering University</span>
          </span>
        </a>
        <h1 class="login-headline">Welcome back to the future of engineering.</h1>
      </div>
    </section>

    <!-- Right: form -->
    <section class="login-right">
      <div class="login-form-wrapper" id="formWrap" data-role="student">

        <a href="landing.html" class="back-home reveal" style="--i:0"><i class="fas fa-arrow-left"></i> Back to portal</a>

        <header class="login-header reveal" style="--i:1">
          <h2 class="login-title">Sign in</h2>
          <p class="login-subtitle">Access your grades, schedule, and campus services.</p>
        </header>

        <div class="role-switch reveal" style="--i:2" role="group" aria-label="Sign in as">
          <span class="role-pill"></span>
          <button type="button" class="role-btn is-active" data-role="student" aria-pressed="true">Student</button>
          <button type="button" class="role-btn" data-role="staff" aria-pressed="false">Faculty &amp; staff</button>
        </div>

        <form id="loginForm" class="login-form" novalidate>
          <div class="field reveal" style="--i:3">
            <label for="studentId" id="idLabel">Student ID or email</label>
            <div class="control">
              <i class="fas fa-user field-icon" aria-hidden="true"></i>
              <input type="text" id="studentId" placeholder="e.g. 2024-00123" autocomplete="username" required>
            </div>
          </div>

          <div class="field reveal" style="--i:4">
            <label for="password">Password</label>
            <div class="control">
              <i class="fas fa-lock field-icon" aria-hidden="true"></i>
              <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" required>
              <button type="button" class="toggle-password" id="togglePassword" aria-label="Show password">
                <i class="fas fa-eye"></i>
              </button>
            </div>
            <p class="hint" id="capsHint" hidden><i class="fas fa-arrow-up"></i> Caps Lock is on</p>
          </div>

          <div class="form-actions reveal" style="--i:5">
            <label class="remember-me">
              <input type="checkbox" id="remember">
              <span class="checkmark"><i class="fas fa-check"></i></span>
              Keep me signed in
            </label>
            <a href="#" class="forgot-password">Forgot password?</a>
          </div>

          <p class="form-message" id="formMessage" role="alert" hidden></p>

          <button type="submit" class="btn-submit reveal" style="--i:6" id="submitBtn">
            <span class="btn-label">Sign in to portal</span>
            <span class="btn-arrow"><i class="fas fa-arrow-right"></i></span>
          </button>
        </form>

        <p class="login-footer reveal" style="--i:7">No account yet? <a href="#">Contact Admissions</a></p>
      </div>
    </section>

  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const stage = document.getElementById('stage');
      const wrap = document.getElementById('formWrap');
      const form = document.getElementById('loginForm');
      const idInput = document.getElementById('studentId');
      const pw = document.getElementById('password');
      const toggle = document.getElementById('togglePassword');
      const btn = document.getElementById('submitBtn');
      const label = btn.querySelector('.btn-label');
      const arrow = btn.querySelector('.btn-arrow i');
      const msg = document.getElementById('formMessage');
      const caps = document.getElementById('capsHint');
      const fine = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
      const calm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      // Photo card: soft glow follows the cursor, photo drifts the other way
      if (fine && !calm) {
        stage.addEventListener('pointermove', (e) => {
          const r = stage.getBoundingClientRect();
          const x = e.clientX - r.left, y = e.clientY - r.top;
          stage.style.setProperty('--mx', x + 'px');
          stage.style.setProperty('--my', y + 'px');
          stage.style.setProperty('--px', (x / r.width - .5).toFixed(3));
          stage.style.setProperty('--py', (y / r.height - .5).toFixed(3));
          stage.classList.add('is-active');
        });
        stage.addEventListener('pointerleave', () => {
          stage.classList.remove('is-active');
          stage.style.setProperty('--px', 0); stage.style.setProperty('--py', 0);
        });
      }

      // Role switch
      document.querySelectorAll('.role-btn').forEach((b) => b.addEventListener('click', () => {
        document.querySelectorAll('.role-btn').forEach((x) => {
          const on = x === b; x.classList.toggle('is-active', on); x.setAttribute('aria-pressed', on);
        });
        wrap.dataset.role = b.dataset.role;
        document.getElementById('idLabel').textContent = b.dataset.role === 'staff' ? 'Employee ID or email' : 'Student ID or email';
      }));

      // Password visibility
      toggle.addEventListener('click', () => {
        const show = pw.type === 'password';
        pw.type = show ? 'text' : 'password';
        toggle.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
        toggle.firstElementChild.className = show ? 'fas fa-eye-slash' : 'fas fa-eye';
      });

      // Caps Lock hint
      pw.addEventListener('keyup', (e) => { caps.hidden = !e.getModifierState('CapsLock'); });
      pw.addEventListener('blur', () => { caps.hidden = true; });

      // Clear error state as the person types
      [idInput, pw].forEach((i) => i.addEventListener('input', () => {
        i.closest('.field').classList.remove('has-error'); msg.hidden = true;
      }));

      // Button ripple
      btn.addEventListener('pointerdown', (e) => {
        if (btn.disabled || calm) return;
        const r = btn.getBoundingClientRect(), s = Math.max(r.width, r.height) * 2;
        const dot = document.createElement('span');
        dot.className = 'ripple';
        dot.style.cssText = `width:${s}px;height:${s}px;left:${e.clientX - r.left - s / 2}px;top:${e.clientY - r.top - s / 2}px`;
        btn.appendChild(dot);
        dot.addEventListener('animationend', () => dot.remove());
      });

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        msg.hidden = true;
        const missing = [idInput, pw].filter((i) => !i.value.trim());
        if (missing.length) {
          missing.forEach((i) => i.closest('.field').classList.add('has-error'));
          msg.textContent = 'Enter your ID or email and your password to continue.';
          msg.hidden = false;
          form.classList.remove('shake'); void form.offsetWidth; form.classList.add('shake');
          missing[0].focus();
          return;
        }

        // Demo only: replace with a real request
        btn.classList.add('loading'); btn.disabled = true;
        label.textContent = 'Signing in…';
        arrow.className = 'fas fa-circle-notch fa-spin';
        setTimeout(() => {
          btn.classList.replace('loading', 'success');
          label.textContent = 'Signed in';
          arrow.className = 'fas fa-check';
          window.location.href = 'faculty-dashboard.html';
        }, 1400);
      });
    });
  </script>
</body>
</html>
