<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Faculty Dashboard · Batangas State University</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link rel="stylesheet" href="css/faculty-dashboard.css" />
</head>
<body class="faculty-body">
  <div class="faculty-app">
    <aside class="sidebar" aria-label="Faculty navigation">
      <div class="sidebar-top">
        <div class="brand">
          <img class="brand-mark" src="medias/BSU-Logo.jpeg" alt="BatStateU logo" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ccircle cx=%2250%22 cy=%2250%22 r=%2245%22 fill=%22%23E93324%22/%3E%3Ctext x=%2250%22 y=%2268%22 font-size=%2240%22 text-anchor=%22middle%22 fill=%22white%22 font-weight=%22bold%22%3EB%3C/text%3E%3C/svg%3E'" />
          <div class="brand-copy"><span class="brand-name">BatStateU</span><span class="brand-sub">Faculty Portal</span></div>
        </div>
        <nav class="sidebar-nav" aria-label="Main navigation">
          <button class="nav-item active" type="button" data-view="dashboard" aria-current="page"><span class="nav-icon"><i class="fas fa-house"></i></span><span>Dashboard</span></button>
          <button class="nav-item" type="button" data-view="my-classes"><span class="nav-icon"><i class="fas fa-chalkboard-user"></i></span><span>My Classes</span></button>
          <button class="nav-item" type="button" data-view="students"><span class="nav-icon"><i class="fas fa-user-group"></i></span><span>Students</span></button>
          <button class="nav-item" type="button" data-view="academic-analytics"><span class="nav-icon"><i class="fas fa-chart-column"></i></span><span>Academic Analytics</span></button>
          <button class="nav-item" type="button" data-view="settings"><span class="nav-icon"><i class="fas fa-gear"></i></span><span>Settings</span></button>
        </nav>
      </div>
      <button class="nav-item logout" type="button" data-view="logout"><span class="nav-icon"><i class="fas fa-arrow-right-from-bracket"></i></span><span>Logout</span></button>
    </aside>
    <main class="main-panel">
      <header class="topbar">
        <h1 id="pageTitle" class="page-title">Dashboard</h1>
        <div class="topbar-actions">
          <label class="search-box"><i class="fas fa-magnifying-glass"></i><input type="search" placeholder="Search" aria-label="Search" /></label>
          <button class="action-button" type="button" aria-label="Notifications"><i class="fas fa-bell"></i></button>
          <div class="profile-pill"><span class="profile-avatar">MS</span><div class="profile-meta"><span class="profile-name">Maria Santos</span><span class="profile-role">Professor</span></div></div>
        </div>
      </header>
      <div id="viewContent" class="content-shell" aria-live="polite"></div>
    </main>
  </div>
  <script src="js/faculty-dashboard.js"></script>
</body>
</html>
