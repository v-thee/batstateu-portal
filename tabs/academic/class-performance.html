<link rel="stylesheet" href="../../css/faculty-dashboard.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

<div class="dashboard-grid">
  <div class="panel">
    <div class="panel-header">
      <h3 class="panel-title">Class performance</h3>
      <button class="secondary-button" type="button">Compare sections</button>
    </div>

    <div class="chart-box">
      <div class="chart-bars">
        <span style="height: 52%;"></span>
        <span style="height: 68%;"></span>
        <span style="height: 73%;"></span>
        <span style="height: 82%;"></span>
        <span style="height: 88%;"></span>
        <span style="height: 92%;"></span>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-header">
      <h3 class="panel-title">Subject difficulty</h3>
      <button class="ghost-button" type="button">View insights</button>
    </div>

    <div class="report-list">
      <div class="report-item">
        <div class="schedule-main">
          <span class="list-icon"><i class="fas fa-magnifying-glass-chart"></i></span>
          <div>
            <strong>Thermodynamics</strong>
            <small>Highest challenge index</small>
          </div>
        </div>
        <span class="score-badge">88</span>
      </div>

      <div class="report-item">
        <div class="schedule-main">
          <span class="list-icon"><i class="fas fa-chart-area"></i></span>
          <div>
            <strong>Engineering Math</strong>
            <small>Stable with moderate gains</small>
          </div>
        </div>
        <span class="score-badge">79</span>
      </div>

      <div class="report-item">
        <div class="schedule-main">
          <span class="list-icon"><i class="fas fa-seedling"></i></span>
          <div>
            <strong>Design Studio</strong>
            <small>Strongest improvement</small>
          </div>
        </div>
        <span class="score-badge">93</span>
      </div>
    </div>
  </div>
</div>
